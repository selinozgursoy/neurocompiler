[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurograph-hw"
version = "0.1.0"
description = "Compile geometric neural circuits onto heterogeneous hardware: a typed graph IR, a cost-model partitioner and a hybrid runtime simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Selin Ozgursoy" }]
keywords = ["compiler", "neuromorphic", "in-memory computing", "equivariance", "MLIR"]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/selinozgursoy/neurocompiler"

[project.scripts]
neurograph = "neurograph.cli:main"

[tool.setuptools]
packages = ["neurograph", "neurograph.ir", "neurograph.compiler", "neurograph.runtime", "api", "api.web"]

[tool.setuptools.package-dir]
"api.web" = "web"

[tool.setuptools.package-data]
"api.web" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
